<!DOCTYPE html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Loans"><title>Loans</title>

<style>

header{background:#fff;padding:8px 14px;box-shadow:0 1px 4px #0002;position:sticky;top:0;z-index:2}header img{height:40px;display:block}
main{padding:12px;max-width:640px;margin:auto}
.c{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.sum{background:linear-gradient(135deg,#1565c0,#2e9d6b);color:#fff}.sum b{font-size:26px;display:block;margin-bottom:6px}
button,select,input,textarea{font:inherit}
button{background:#1565c0;color:#fff;border:0;border-radius:8px;padding:8px 12px;margin:3px 3px 0 0}
button.g{background:#2e9d6b}button.r{background:#d32f2f}button.l{background:#e3edf7;color:#1565c0}

.od{color:#d32f2f;font-weight:600}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}

<script>

sure:'खात्री आहे का?|पक्का?|Are you sure?',trash:'कचरापेटी (३० दिवस)|कचरापेटी (30 दिन)|Trash (30 days)',restore:'परत आणा|वापस लाएं|Restore',lang:'भाषा|भाषा|Language',
pin:'पिन (४ अंक, रिकामा = बंद)|पिन (4 अंक, खाली = बंद)|PIN (4 digits, empty = off)',bk:'Drive वर बॅकअप|Drive पर बैकअप|Backup to Drive',rs:'बॅकअप परत आणा|बैकअप वापस लाएं|Restore backup',au:'आपोआप बॅकअप|ऑटो बैकअप|Auto backup',

bank:'संस्था / कार्डचं नाव|संस्था / कार्ड का नाम|Lender / card name',ltotal:'एकूण लोन रक्कम|कुल लोन राशि|Total loan',rate:'व्याजदर %|ब्याज दर %|Interest %',months:'कालावधी (महिने)|अवधि (महीने)|Tenure (months)',amt:'EMI रक्कम|EMI राशि|EMI amount','cc.amt':'शेवटचं बिल / भरलेली रक्कम|आखिरी बिल / चुकाई राशि|Last bill / amount paid',
start:'पहिली EMI तारीख|पहली EMI तिथि|First EMI date',due:'पुढची देय तारीख|अगली देय तिथि|Next due date',limit:'कार्ड लिमिट|कार्ड लिमिट|Card limit','cc.out':'थकबाकी रक्कम|बकाया राशि|Outstanding amount',
note:'टीप|नोट|Note',rem:'रिमाइंडर (किती दिवस आधी, स्वल्पविरामाने)|रिमाइंडर (कितने दिन पहले, कॉमा से)|Reminders (days before, comma separated)',rt:'रिमाइंडर वेळ|रिमाइंडर समय|Reminder time',files:'कागदपत्रे (फोटो/PDF)|दस्तावेज़ (फोटो/PDF)|Documents (photo/PDF)'};
T.acc='खाते क्रमांक / कार्डचे शेवटचे ४ अंक|खाता क्रमांक / कार्ड के अंतिम 4 अंक|Account no. / card last 4';
const F={pl:[['bank','t'],['acc','t'],['ltotal','n'],['rate','n'],['months','n'],['amt','n'],['start','d'],['due','d']],cc:[['bank','t'],['acc','t'],['limit','n'],['out','n'],['amt','n'],['due','d']]};
let S={lang:0,pin:'',items:[],auto:0},db,v=['home'],rp={},tmp=[],rows=[],imp=[],ii=0,cnt=[0,0];
const t=s=>s.split('|')[S.lang]||s,L=k=>t(T[k]||T[k.split('.').pop()]||k);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function addM(s,m){const d=new Date(s+'T00:00'),x=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()!=x)d.setDate(0);return iso(d)}
const find=id=>S.items.find(x=>x.id==id),act=()=>S.items.filter(i=>!i.del);
const out=i=>i.seg=='cc'?+i.f.out||0:Math.max(0,(+i.f.months||0)-i.hist.length)*(+i.f.amt||0);
const idb=()=>new Promise(r=>{const q=indexedDB.open('ct',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const get=async()=>{db=db||await idb();return new Promise(r=>{const q=db.transaction('k').objectStore('k').get('S');q.onsuccess=()=>r(q.result)})};
const put=async nb=>{db=db||await idb();db.transaction('k','readwrite').objectStore('k').put(S,'S');if(!nb)auto()};
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ct'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const go=(...a)=>{v=a;R();scrollTo(0,0)};
function prog(i){const f=i.f;let p=0,x='';if(i.seg=='pl'&&+f.months){p=i.hist.length/f.months*100;x=i.hist.length+'/'+f.months}else if(i.seg=='cc'&&+f.limit){p=(+f.out||0)/f.limit*100;x='₹'+(f.out||0)+' / ₹'+f.limit}else return '';
return `<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div><small>${x}</small>`}
function card(i){const f=i.f,od=f.due&&f.due<iso(new Date());return `<div class="c" onclick="go('det','${i.id}')" style="cursor:pointer"><div class="row"><b>${esc(f.bank)}</b><span>₹${f.amt||0}</span></div><small>${L(i.seg)} · </small><small class="${od?'od':''}">${f.due||''}</small>${prog(i)}</div>`}
function home(){const a=act().sort((x,y)=>(x.f.due||'9')<(y.f.due||'9')?-1:1),ym=iso(new Date()).slice(0,7),m=a.filter(i=>i.f.due&&i.f.due.slice(0,7)<=ym).reduce((n,i)=>n+(+i.f.amt||0),0),o=a.reduce((n,i)=>n+out(i),0);
return `<div class="np"><button class="l" onclick="$('#sf').click()">📄 ${L('imp')}</button><button class="l" onclick="$('#af').click()">📑 ${L('agr')}</button><button onclick="go('form','pl')">${L('addl')}</button><button onclick="go('form','cc')">${L('addc')}</button></div><input id="sf" type="file" accept="application/pdf" hidden onchange="parse(this)"><input id="af" type="file" accept="application/pdf" hidden onchange="agr(this)"><div class="c sum" style="margin-top:8px"><small style="color:#fff">${L('mt')}</small><b>₹${m.toLocaleString('en-IN')}</b><small style="color:#fff">${L('out')}</small><b>₹${o.toLocaleString('en-IN')}</b></div><h3>${L('yl')}</h3>`+(a.map(card).join('')||`<p>${L('none')}</p>`)}
function det(id){const i=find(id),f=i.f,s=i.seg,h=[...i.hist].sort((a,b)=>a.d<b.d?1:-1),tp=i.hist.reduce((n,x)=>n+x.a,0);
const r=F[s].filter(([k])=>f[k]).map(([k,ty])=>`<tr><td><small>${L(s+'.'+k)}</small><td align="right">${ty=='n'&&k!='rate'&&k!='months'?'₹':''}${esc(f[k])}`).join('');
return `<button class="l" onclick="go('home')">${L('back')}</button><div class="c"><div class="row"><b>${esc(f.bank)}</b><small>${L(s)}</small></div>${prog(i)}<table width="100%">${r}<tr><td><small>${L('totp')}</small><td align="right">₹${tp}</table>${f.note?`<p>${esc(f.note)}</p>`:''}${(i.files||[]).map((x,n)=>`<div><a href="#" onclick="openF('${id}',${n});return false">📎 ${esc(x.n)}</a></div>`).join('')}<div>${f.due?`<button class="g" onclick="paid('${id}')">${L('paid')}</button><button class="l" onclick="ics('${id}')">${L('cal')}</button>`:''}<button class="l" onclick="go('form','${s}','${id}')">${L('edit')}</button><button class="r" onclick="rm('${id}')">${L('del')}</button></div></div><div class="c"><b>${L('hist')}</b><table width="100%">${h.map(x=>`<tr><td>${x.d}<td align="right">₹${x.a}`).join('')||`<tr><td>${L('none')}`}</table></div>`}
const fl=()=>tmp.map((x,n)=>esc(x.n)+` <a href="#" onclick="tmp.splice(${n},1);$('#fls').innerHTML=fl();return false">✕</a>`).join('<br>');
function form(s,id,dr){const i=id?find(id):(dr||{seg:s,f:{},rem:'7,1,0',rt:'09:00',files:[]});tmp=[...(i.files||[])];
const fs=F[s].map(([k,ty])=>`<label>${L(s+'.'+k)}</label><input id="f_${k}" type="${ty=='n'?'number':ty=='d'?'date':'text'}" ${ty=='n'?'inputmode="decimal" step="any"':''} value="${esc(i.f[k]??'')}">`).join('');

function bfill(i){const f=i.f,m0=iso(new Date()).slice(0,8)+'01',N=+f.months||999;let n=0,d=f.start;while(d&&d<m0&&n<N){i.hist.push({d,a:+f.amt||0});n++;d=addM(f.start,n)}f.due=n>=N?'':d}
function save(s,id){const f={};F[s].forEach(([k])=>f[k]=$('#f_'+k).value);f.note=$('#note').value;const o={seg:s,f,rem:$('#rem').value,rt:$('#rt').value,files:tmp};
if(id)Object.assign(find(id),o);else{const i={id:Date.now().toString(36),hist:[],...o};if(s=='pl'&&f.start){if($('#bf')&&$('#bf').checked)bfill(i);else if(!f.due)f.due=f.start}S.items.push(i)}put();go(id?'det':'home',id)}
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function addF(e){for(const f of e.files){let u;if(f.type.startsWith('image')){const m=new Image;m.src=await rd(f);await m.decode();const k=Math.min(1,1000/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.6)}else if(f.size<1.5e6)u=await rd(f);else{alert('PDF max 1.5 MB');continue}tmp.push({n:f.name,u})}e.value='';$('#fls').innerHTML=fl()}
const openF=(id,n)=>fetch(find(id).files[n].u).then(r=>r.blob()).then(b=>open(URL.createObjectURL(b)));
function paid(id){const i=find(id),f=i.f;i.hist.push({d:iso(new Date()),a:+f.amt||0});f.due=(i.seg=='pl'&&+f.months&&i.hist.length>=+f.months)?'':addM(f.due,1);put();R()}
function rm(id){if(confirm(L('sure'))){find(id).del=Date.now();put();go('home')}}
function dl(n,b,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:ty}));a.download=n;a.click()}
function ics(id){const i=find(id),n=(i.f.bank||'').replace(/[,;\n]/g,' '),left=i.seg=='pl'&&+i.f.months?+i.f.months-i.hist.length:0,al=String(i.rem||'0').split(',').map(x=>x.trim()).filter(x=>x!=='').map(x=>`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${n}\r\nTRIGGER:${+x?'-P'+(+x)+'D':'PT0S'}\r\nEND:VALARM`).join('\r\n');
dl('reminder.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Loans//EN\r\nBEGIN:VEVENT\r\nUID:${id}${Date.now()}@loans\r\nDTSTAMP:${new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)}Z\r\nDTSTART:${i.f.due.replace(/-/g,'')}T${(i.rt||'09:00').replace(':','')}00\r\nDURATION:PT30M\r\nSUMMARY:${n} ₹${i.f.amt||0}\r\nRRULE:FREQ=MONTHLY${left>0?';COUNT='+left:''}\r\n${al}\r\nEND:VEVENT\r\nEND:VCALENDAR`,'text/calendar')}
function rep(){const n=new Date(),y=n.getFullYear()-(n.getMonth()<3?1:0);if(!rp.t)rp={t:'m',m:iso(n).slice(0,7),y};
const[a,b]=rp.t=='m'?[rp.m+'-01',rp.m+'-31']:[rp.y+'-04-01',(rp.y+1)+'-03-31'];rows=[];
act().forEach(i=>i.hist.filter(h=>h.d>=a&&h.d<=b).forEach(h=>rows.push([h.d,L(i.seg),i.f.bank||'',h.a])));rows.sort();const s=rows.reduce((n,r)=>n+r[3],0);
return `<div class="c np"><select onchange="rp.t=this.value;R()"><option value="m" ${rp.t=='m'?'selected':''}>${L('month')}</option><option value="y" ${rp.t=='y'?'selected':''}>${L('fy')}</option></select>`+(rp.t=='m'?`<input type="month" value="${rp.m}" onchange="rp.m=this.value;R()">`:`<select onchange="rp.y=+this.value;R()">${[...Array(6)].map((_,k)=>{const x=y-4+k;return `<option value="${x}" ${x==rp.y?'selected':''}>${x}-${String(x+1).slice(2)}</option>`}).join('')}</select>`)+`<button onclick="csv()">${L('csv')}</button><button class="g" onclick="print()">PDF</button></div><div class="c"><b>${L('hist')}</b> ${rp.t=='m'?rp.m:rp.y+'-'+(rp.y+1)}<table width="100%">${rows.map(r=>`<tr><td>${r[0]}<td>${esc(r[2])}<td align="right">₹${r[3]}`).join('')}<tr><td colspan="2"><b>${L('tot')}</b><td align="right"><b>₹${s}</b></table></div>`}
const csv=()=>dl('hisab.csv','\ufeff'+[['Date','Type','Name','Amount'],...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
const trash=()=>`<h3>${L('trash')}</h3>`+(S.items.filter(i=>i.del).map(i=>`<div class="c row"><span>${esc(i.f.bank)}</span><button class="l" onclick="delete find('${i.id}').del;put();R()">${L('restore')}</button></div>`).join('')||`<p>${L('none')}</p>`);
const sett=()=>`<div class="c"><label>${L('lang')}</label><select onchange="S.lang=+this.value;put();R()">${['मराठी','हिंदी','English'].map((x,n)=>`<option value="${n}" ${S.lang==n?'selected':''}>${x}</option>`).join('')}</select><label>${L('pin')}</label><input id="pin" type="password" inputmode="numeric" maxlength="4"><button onclick="setPin()">${L('save')}</button></div><div class="c"><button onclick="bak()">${L('bk')}</button><button class="l" onclick="res()">${L('rs')}</button><label><input type="checkbox" style="width:auto" ${S.auto?'checked':''} onchange="S.auto=+this.checked;put(1)"> ${L('au')}</label></div><button class="l" onclick="go('trash')">🗑️ ${L('trash')}</button>`;
async function setPin(){const x=$('#pin').value;if(x&&!/^\d{4}$/.test(x))return alert('4');S.pin=x?await hash(x):'';put();alert(L('done'))}
async function ul(){if(await hash($('#lp').value)==S.pin){$('#lock').classList.remove('on');$('#lp').value=''}else $('#lm').textContent=L('wrong')}
let tok,exp=0,tc,pend,tm;
function auth(cb){if(tok&&Date.now()<exp)return cb();pend=cb;if(!window.google)return alert('Offline');tc=tc||google.accounts.oauth2.initTokenClient({client_id:CID,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.access_token){tok=r.access_token;exp=Date.now()+3.4e6;pend&&pend()}}});tc.requestAccessToken()}
const H=()=>({Authorization:'Bearer '+tok});
async function fid(){const r=await(await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'ct.json'&fields=files(id)",{headers:H()})).json();return r.files[0]?.id}
function bak(q){auth(async()=>{try{const id=await fid(),b='x'+Date.now(),m=JSON.stringify(id?{}:{name:'ct.json',parents:['appDataFolder']}),body=`--${b}\r\nContent-Type: application/json\r\n\r\n${m}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${b}--`;
const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files${id?'/'+id:''}?uploadType=multipart`,{method:id?'PATCH':'POST',headers:{...H(),'Content-Type':'multipart/related; boundary='+b},body});if(!r.ok)throw 0;if(!q)alert(L('done'))}catch(e){if(!q)alert('Error')}})}
function res(){auth(async()=>{const id=await fid();if(!id)return alert(L('none'));if(!confirm(L('sure')))return;S=await(await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:H()})).json();migrate();await put(1);R()})}
const auto=()=>{if(!S.auto||!navigator.onLine)return;clearTimeout(tm);tm=setTimeout(()=>{if(tok&&Date.now()<exp)bak(1)},4000)};
/* ---- PDF: statement + agreement ---- */
const nk=s=>String(s||'').toUpperCase().replace(/[^A-Z]/g,''),sk=(n,a)=>nk(n)+(nk(n)=='EMI'?a:'');
const CC=/CREDIT ?CARD|CRED\b|CARD PAYMENT|CC PAY|SBI CARD|AMEX/i,LN=/^ACH-?D|NACH|ECS|(^|[^A-Z])EMI([^A-Z]|$)|FINS\b|FINANCE|FINCORP|\bCAP\b|CAPITAL|CREDITCO|HOUSING|LOAN/i;
function findEx(s,n,a){const k=sk(n,a),x=nk(n);return act().find(i=>i.seg==s&&(i.sk==k||(x.length>3&&x!='EMI'&&nk(i.f.bank).slice(0,6)==x.slice(0,6))))}
function nm(p){let s=p.replace(/^ACH-?DR-?/i,'').replace(/^UPI\/P2[MA]\/\d+\//i,'').replace(/^NEFT\/\w+\//i,'').replace(/^PPR\d+_/,'');s=((s.match(/^[A-Za-z][A-Za-z .&_]*/)||[''])[0]).replace(/_/g,' ').trim();if(/^EMI\b/i.test(s))s='EMI';return s.length>2?s:p.slice(0,20)}
function txns(tx){tx=tx.split(/TRANSACTION TOTAL/i)[0].replace(/\s+/g,' ');const o=tx.match(/OPENING BALANCE\s*([\d,]+\.\d{2})/i),out=[],re=/([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+\d{2,4}(?!\d)/g;let prev=null,last=0,m;
if(o){prev=+o[1].replace(/,/g,'');tx=tx.slice(o.index+o[0].length)}
while(m=re.exec(tx)){const g=tx.slice(last,m.index),dm=g.match(/(?:^|\s)(\d{2}-\d{2}-\d{4})(?=\s|$)/);last=re.lastIndex;if(!dm)continue;
const p=g.replace(dm[1],'').replace(/\s+/g,' ').trim(),a=+m[1].replace(/,/g,''),bal=+m[2].replace(/,/g,''),cr=prev!==null&&bal>prev;prev=bal;
const s=cr?'':CC.test(p)?'cc':LN.test(p)?'pl':'';if(s)out.push({d:dm[1].split('-').reverse().join('-'),a,n:nm(p),seg:s})}
return out}
const MN='jan feb mar apr may jun jul aug sep oct nov dec'.split(' ');
function pd(s){const m=(s||'').match(/(\d{1,2})(?:st|nd|rd|th)?[-\/. ,]+([A-Za-z]{3,9}|\d{1,2})[-\/. ,]+(\d{2,4})/);if(!m)return '';const mo=isNaN(m[2])?MN.indexOf(m[2].slice(0,3).toLowerCase())+1:+m[2];let y=+m[3];if(y<100)y+=2000;return mo>0&&mo<13?`${y}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}
function ext(tx){tx=tx.replace(/\s+/g,' ');const g=r=>{const m=tx.match(r);return m?m[1]:''},n=s=>s.replace(/,/g,''),f={};
f.bank=g(/([A-Z][\w&.]*(?:\s+[A-Z&][\w&.]*){0,4}\s+(?:Bank|Finance|Finserv|Fincorp|Capital|Financial Services)(?:\s+(?:Limited|Ltd\.?))?)/);
f.acc=g(/(?:loan (?:account )?(?:no|number)|agreement (?:no|number)|account (?:no|number))\.?[^A-Za-z0-9]{0,15}([A-Z0-9-]{6,25})/i);
f.ltotal=n(g(/(?:loan amount|sanctioned amount|principal amount|amount of loan|loan sanctioned)[^0-9]{0,40}([\d,]+(?:\.\d+)?)/i));
f.rate=g(/(?:rate of interest|interest rate|ROI|annual percentage rate)[^0-9]{0,40}([\d.]+)\s*%/i);
const q=tx.match(/(?:tenure|tenor|loan term|term)[^0-9]{0,40}(\d{1,3})\s*(month|year|yr)/i);if(q)f.months=String(/y/i.test(q[2])?q[1]*12:q[1]);
f.amt=n(g(/(?:EMI amount|EMI|equated monthly instal?l?ment|monthly instal?l?ment)[^0-9]{0,40}([\d,]+(?:\.\d+)?)/i));
f.start=pd(g(/(?:first (?:EMI|instal?l?ment) date|EMI start date|date of first (?:EMI|instal?l?ment)|first repayment date|first due date)[^0-9]{0,40}([\s\S]{0,25})/i));return f}
async function pdfText(f){if(!window.pdfjsLib){alert('Offline');return null}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const k=pdfjsLib.getDocument({data:await f.arrayBuffer()});k.onPassword=cb=>cb(prompt(L('pw'))||'');const d=await k.promise;let tx='';for(let p=1;p<=d.numPages;p++)tx+=' '+(await(await d.getPage(p)).getTextContent()).items.map(x=>x.str).join(' ');return tx}
async function parse(e){const f=e.files[0];e.value='';if(!f)return;try{const tx=await pdfText(f);if(tx==null)return;imp=txns(tx);ii=0;cnt=[0,0];go('imp')}catch(x){alert('Error: '+(x.message||x))}}
async function agr(e){const f=e.files[0];e.value='';if(!f)return;try{const tx=await pdfText(f);if(tx==null)return;const x=ext(tx);if(!Object.values(x).some(Boolean))alert(L('scan'));go('form','pl','',{seg:'pl',f:x,rem:'7,1,0',rt:'09:00',files:[]})}catch(y){alert('Error: '+(y.message||y))}}
function impv(){if(!imp.length)return `<h3>${L('imp')}</h3><p>${L('nf')}</p>`;const r=imp[ii],ex=findEx(r.seg,r.n,r.a);
return `<h3>${L('imp')} ${ii+1}/${imp.length}</h3><div class="c"><div class="row"><b>${esc(r.n)}</b><b>₹${r.a}</b></div><small>${r.d} · ${L(ex?'upd':'new')}</small><label>${L('type')}</label><select onchange="imp[ii].seg=this.value;R()">${['pl','cc'].map(x=>`<option value="${x}" ${r.seg==x?'selected':''}>${L(x)}</option>`).join('')}</select><p><button class="g" onclick="imAns(1)">${L('yes')}</button><button class="r" onclick="imAns(0)">${L('no')}</button></p></div>`}
function add1(r){const s=r.seg;let i=findEx(s,r.n,r.a);
if(!i){S.items.push({id:Date.now().toString(36)+ii,seg:s,sk:sk(r.n,r.a),rem:'7,1,0',rt:'09:00',files:[],hist:[{d:r.d,a:r.a}],f:{bank:r.n,amt:r.a,due:addM(r.d,1)}});cnt[0]++;return}
const ex=i.hist.find(h=>h.d.slice(0,7)==r.d.slice(0,7));if(ex){if(ex.d==r.d&&ex.a==r.a)return;ex.d=r.d;ex.a=r.a}else i.hist.push({d:r.d,a:r.a});
i.f.amt=r.a;cnt[1]++;let d=i.f.due,g=0;while((!d||d<=r.d)&&g++<24)d=addM(d||r.d,1);i.f.due=(s=='pl'&&+i.f.months&&i.hist.length>=+i.f.months)?'':d}
function imAns(y){if(y){add1(imp[ii]);put()}ii++;if(ii>=imp.length){go('home');alert(`${L('new')}: ${cnt[0]}\n${L('upd')}: ${cnt[1]}`)}else R()}
function migrate(){S.items=(S.items||[]).filter(i=>['loan','pl','cc'].includes(i.seg)&&(!i.del||Date.now()-i.del<2592e6));S.items.forEach(i=>{if(i.seg=='loan')i.seg='pl';i.hist=i.hist||[]})}
function R(){document.documentElement.lang=['mr','hi','en'][S.lang];const[n,a,b]=v,tab=n=='rep'?'rep':n=='set'||n=='trash'?'set':'home';
$('main').innerHTML={home,form,det,rep,trash,imp:impv,set:sett}[n](a,b,v[3]);$('#lb').textContent=L('unl');
$('nav').innerHTML=[['home','🏠'],['rep','📊'],['set','⚙️']].map(([k,e])=>`<button class="${tab==k?'a':''}" onclick="go('${k}')">${e}<br>${L('n_'+k)}</button>`).join('')}
(async()=>{const d=await get();if(d)S={...S,...d};migrate();R();if(S.pin)$('#lock').classList.add('on');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
